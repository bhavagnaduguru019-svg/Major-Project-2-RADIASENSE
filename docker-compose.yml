version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
